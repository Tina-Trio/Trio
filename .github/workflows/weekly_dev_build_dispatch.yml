name: Weekly dev build dispatcher
run-name: Weekly dev build dispatcher

on:
  schedule:
    # Sundays at 11:15 UTC (7:15 AM Toronto during daylight time)
    - cron: "15 11 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-dev-build:
    name: Dispatch dev build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Build Trio on dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build_trio.yml --repo "$GITHUB_REPOSITORY" --ref dev
          echo "Dispatched build_trio.yml on dev."

      - name: Show newest dev build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build_trio.yml \
            --branch dev \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,displayTitle,status,conclusion,createdAt,url